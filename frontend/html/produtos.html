<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
        <script src="../js/produtos.js"defer></script>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="./dashboard.html">Dashboard</a>
            <a href="./usuarios.html">Usuários</a>
            <a href="./produtos.html">Produtos</a>
            <a href="./compras.html">Movimentações/Vendas</a>
            <a href="./relatorio_analitico.html">Analítico</a>
            <a href="./relatorio_grafico.html">Gráficos</a>
        </nav>
    </header>
    <main>
        <h1>Gerenciamento de Produtos</h1>
        <form id="formProduto">
            <label>Título:</label><input type="text" id="title" required>
            <label>Categoria:</label><input type="text" id="category" required>
            <label>Preço:</label><input type="number" step="0.01" id="price" required>
            <label>Estoque:</label><input type="number" id="stock" required>
            <label>Marca:</label><input type="text" id="brand">
            <button type="submit">Cadastrar Produto</button>
        </form>
        <br>
        <table id="tabelaProdutos">
            <thead>
                <tr><th>ID</th><th>Título</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>


</body>
</html>
